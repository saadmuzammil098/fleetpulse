# Install once per clone with `pre-commit install` (see task-8/README.md's
# "pre-commit" section), after that these hooks run automatically on every
# `git commit`, on staged files only, using the same ruff config
# (pyproject.toml) CI lints against.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=2000]
