# Placeholder Secret, wired through properly even though the API doesn't
# consume it yet — Task 6 is about practicing the Secret mechanism
# (base64-in-etcd, envFrom, kubectl exec to inspect it) ahead of the day
# there's a real credential to protect.
#
# FLEETPULSE_MLFLOW_TRACKING_TOKEN anticipates a specific, already-named
# future need: task-5/README.md ("why the model isn't baked in") flags
# that a real deployment would swap the current bare local SQLite/file
# MLflow store for a remote tracking *server* — and a remote tracking
# server is the point at which an auth token becomes a real requirement
# instead of a MLflow-has-no-auth-for-a-local-file-store non-issue. Value
# below is a placeholder, not a real credential.
#
# Generated with:
#   kubectl create secret generic fleet-health-api-secret \
#     --namespace fleetpulse \
#     --from-literal=FLEETPULSE_MLFLOW_TRACKING_TOKEN=placeholder-not-a-real-token \
#     --dry-run=client -o yaml
apiVersion: v1
kind: Secret
metadata:
  name: fleet-health-api-secret
  namespace: fleetpulse
type: Opaque
stringData:
  FLEETPULSE_MLFLOW_TRACKING_TOKEN: placeholder-not-a-real-token
