name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt -r requirements-dev.txt -r task-10/requirements.txt

      # Unit tests: the shared feature module and the API's request/
      # response schemas, in isolation.
      - name: Unit tests
        run: python -m pytest task-8/tests/test_features.py task-8/tests/test_schemas.py task-8/tests/test_api.py -v

      # Data tests: Task 1's Pandera schema, run as an automated check on
      # every PR instead of only at ingestion time. Against synthetic
      # fixture data, not the real DVC-tracked dataset, GitHub-hosted
      # runners cannot reach the local Floci S3 endpoint Task 1's DVC
      # remote points at, see task-8/README.md.
      - name: Data tests
        run: python -m pytest task-8/tests/test_data_contract.py -v

      # Training smoke test: a fast, reduced-scope run of Task 2's
      # pipeline shape (CV, calibration, thresholding, metrics) proving it
      # still executes end to end, not a real retrain.
      - name: Training smoke test
        run: python -m pytest task-8/tests/test_training_smoke.py -v

      # Behavioral tests: FleetPulse-specific directional-expectation
      # checks through the real serving path. This is the step the
      # intentionally-broken PR in task-8/README.md's demo is meant to
      # fail.
      - name: Behavioral tests
        run: python -m pytest task-8/tests/test_behavioral.py -v

      # Task 10: the Evidently drift-scoring math in isolation (synthetic
      # dataframes, no CloudWatch/Floci access needed — see
      # task-10/tests/test_drift_report.py's docstring for why the
      # CloudWatch-reading and reference-loading halves aren't covered
      # here, the same hosted-runner-can't-reach-Floci constraint as
      # everything else in this job).
      - name: Drift job unit tests
        run: python -m pytest task-10/tests/test_drift_report.py -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Fleet Health Risk API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: task-5/Dockerfile
          push: false
          tags: fleetpulse-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Task 9: build the Lambda image, push it to Floci's emulated ECR, and
  # run Terraform against Floci, plan on every PR, apply on merge to main.
  #
  # This job runs on a SELF-HOSTED runner, not ubuntu-latest: Floci only
  # listens on localhost.floci.io on this machine, GitHub's hosted
  # runners run in GitHub's cloud and cannot reach it (the same
  # local-only constraint task-8/README.md already documented for DVC,
  # just hit again here for infrastructure instead of data). A
  # self-hosted runner is a real trade-off, not a free lunch: it means
  # any workflow run, including from a PR, can execute on this laptop,
  # see task-9/README.md's "why a self-hosted runner" for the reasoning
  # and how to shut it down.
  deploy:
    runs-on: [self-hosted, floci]
    needs: [lint, test]
    # pull-requests: write is what lets the "Post plan to PR" step below
    # comment the plan onto the PR; default GITHUB_TOKEN permissions are
    # read-only on some repos/orgs, so this is declared explicitly rather
    # than assumed.
    permissions:
      contents: read
      pull-requests: write
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localhost.floci.io:4566
      TF_VAR_image_tag: ${{ github.sha }}
      # Explicit, not left to whatever this self-hosted runner's account
      # defaults to: actions/setup-python (see below) and
      # hashicorp/setup-terraform both cache downloaded tools under
      # $RUNNER_TOOL_CACHE, and on this runner's account that otherwise
      # resolved to an unwritable /Users/runner path.
      RUNNER_TOOL_CACHE: /Users/saadmuzammil/actions-runner/_toolcache
    steps:
      - uses: actions/checkout@v4

      # actions/setup-python's hosted-runner tool cache assumes a
      # /Users/runner-style home directory and fails with a permission
      # error on this self-hosted runner's own account. This machine
      # already has python3.12 on PATH (the same interpreter every other
      # task's .venv uses), so a throwaway per-job venv sidesteps the
      # tool cache entirely instead of fighting it.
      - name: Set up venv
        run: |
          python3.12 -m venv .ci-venv
          echo "$PWD/.ci-venv/bin" >> "$GITHUB_PATH"
      - run: pip install -r requirements.txt

      # Unlike task-8's CI (hosted runners, no Floci access), this
      # self-hosted runner CAN reach Floci's S3 endpoint, so it pulls
      # Task 1's real cleaned dataset instead of falling back to
      # synthetic data, see task-9/scripts/export_model.py.
      - name: dvc pull (Task 1 cleaned dataset)
        working-directory: task-1
        run: dvc pull

      - name: Export Lambda model artifact
        working-directory: task-9
        run: python -m scripts.export_model

      - name: Build Lambda image
        run: docker build -f task-9/Dockerfile -t fleetpulse-api-lambda:${{ github.sha }} .

      - name: Push image to Floci ECR
        run: |
          set -euo pipefail
          REPO_URI=$(aws ecr describe-repositories --repository-names fleetpulse-api \
            --query 'repositories[0].repositoryUri' --output text 2>/dev/null || echo "")
          if [ -z "$REPO_URI" ] || [ "$REPO_URI" = "None" ]; then
            REPO_URI=$(aws ecr create-repository --repository-name fleetpulse-api \
              --query 'repository.repositoryUri' --output text)
          fi
          REGISTRY="${REPO_URI%%/*}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          docker tag fleetpulse-api-lambda:${{ github.sha }} "$REPO_URI:${{ github.sha }}"
          docker push "$REPO_URI:${{ github.sha }}"

      # terraform_wrapper wraps the `terraform` binary so steps below that
      # set an `id:` get its stdout/stderr/exit code as step outputs
      # (steps.plan.outputs.stdout, etc.), which is what makes posting
      # the plan to the PR possible without a separate log-scraping step.
      # Version pinned to match this machine's local Terraform, so a
      # `terraform plan` here and one run by hand say the same thing.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: true

      - name: Terraform fmt check
        working-directory: task-9/terraform
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: task-9/terraform
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: task-9/terraform
        run: terraform validate -no-color

      # continue-on-error here is deliberate: a failed plan should still
      # get posted to the PR (so a reviewer can see *why* it failed,
      # e.g. a bad interpolation), not disappear silently. The explicit
      # "Fail job if plan failed" step below is what actually turns a
      # plan error back into a failed check.
      - name: Terraform plan
        id: plan
        working-directory: task-9/terraform
        run: terraform plan -input=false -no-color -out=tfplan
        continue-on-error: true

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_STDOUT: ${{ steps.plan.outputs.stdout }}
          PLAN_STDERR: ${{ steps.plan.outputs.stderr }}
        with:
          script: |
            const marker = "<!-- task-9-terraform-plan -->";
            const outcome = "${{ steps.plan.outcome }}";
            const body_text = (process.env.PLAN_STDOUT || "") + (process.env.PLAN_STDERR || "(no output)");
            // GitHub caps comment bodies well above this, but keep it
            // sane for a human actually reading the PR.
            const truncated = body_text.length > 60000
              ? body_text.slice(0, 60000) + "\n... (truncated, see the full run log)"
              : body_text;
            const icon = outcome === "success" ? "✅" : "❌";
            const body = `${marker}\n#### Terraform Plan (task-9) ${icon} \`${outcome}\`\n\n`
              + `<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${truncated}\n\`\`\`\n\n</details>\n\n`
              + `*Commit \`${context.sha.slice(0, 7)}\`, workflow run [#${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail job if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

      # Only merges to main touch the live function. A PR run stops here.
      - name: Terraform apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: task-9/terraform
        run: terraform apply -input=false -auto-approve tfplan

      # Task 10 observability smoke check: every merge redeploys the
      # Lambda, so every merge should re-prove the thing Task 10 is
      # actually about — a real prediction's structured log landing in
      # CloudWatch Logs via Floci with zero extra plumbing (see
      # task-10/README.md). A unique marker in vehicle_id makes this
      # invocation, not just "some invocation", findable in the log
      # group. Full drift scoring against Task 1's reference data isn't
      # run here on purpose: it needs a real current-traffic window,
      # which a single post-deploy request isn't, and Task 10's own
      # dashboards/alerting live in task-5's long-running docker-compose
      # stack, not this short-lived CI job.
      - name: Observability smoke check (CloudWatch Logs via Floci)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: task-9/terraform
        run: |
          set -euo pipefail
          FN_URL=$(terraform output -raw function_url)
          MARKER="ci-smoke-${{ github.sha }}"
          curl -sf -X POST "$FN_URL/predict" -H "Content-Type: application/json" -d "{
            \"vehicle_id\": \"$MARKER\", \"type\": \"M\",
            \"telemetry_window\": [{\"air_temperature_k\": 300.0, \"process_temperature_k\": 310.0,
              \"rotational_speed_rpm\": 1500.0, \"torque_nm\": 60.0, \"tool_wear_min\": 220.0}]
          }" > /dev/null
          sleep 3
          FOUND=$(aws logs filter-log-events --log-group-name /aws/lambda/fleetpulse-api \
            --start-time $(( ($(date +%s)-60)*1000 )) --filter-pattern "$MARKER" \
            --query 'events[*].message' --output text)
          if [ -z "$FOUND" ]; then
            echo "::error::prediction_made log for $MARKER not found in CloudWatch Logs"
            exit 1
          fi
          echo "Found in CloudWatch Logs: $FOUND"
